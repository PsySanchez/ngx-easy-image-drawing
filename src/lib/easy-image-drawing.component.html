<div class="canvas-wrapper">
  <canvas id="canvas" #drawingCanvas></canvas>
</div>
<div class="image-button-wrapper">
  <button
    type="button"
    (click)="save()"
    class="button save"
    [style.background-color]="saveButtonColor()"
  >
    Save
  </button>
  <button
    type="button"
    (click)="clear()"
    class="button undo"
    [style.background-color]="undoButtonColor()"
  >
    Undo
  </button>
</div>
<!-- color picker -->
@if (showColorPicker()) {
  <div class="color-picker-wrapper">
    <label for="rgb-picker" class="picker-label">Select a color:</label>
    <input
      type="color"
      id="rgb-picker"
      class="rgb-input"
      (change)="onColorSelected($event)"
    />
  </div>
}
<!-- line width picker -->
@if (showlineWidthPicker()) {
  <div class="line-width-slider">
    <label for="line-width-slider">Line width:</label>
    <input
      type="range"
      id="line-width-slider"
      min="5"
      max="20"
      value="5"
      (input)="onLineWidthChanged($event)"
    />
  </div>
}
